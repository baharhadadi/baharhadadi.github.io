<!-- Canvas for Matrix effect -->
<canvas id="wave-canvas" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;"></canvas>

<script>
// Matrix effect code
let animationRunning = false;

function startWaveEffect() {
  const canvas = document.getElementById('wave-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  canvas.style.display = 'block';
  animationRunning = true;
  
  // Characters for the effect
  const chars = '01';
  let columns = Math.floor(canvas.width / 30);
  let drops = Array(columns).fill(0);
  let characterLines = [];
  
  // Create all character lines before animation starts
  for (let i = 0; i < columns; i++) {
    let line = '';
    for (let j = 0; j < 16; j++) {
      line += chars[Math.floor(Math.random() * chars.length)];
    }
    characterLines.push(line);
  }
  
  let frameCount = 0;
  let allFinished = false;
  let waveAnimation;
  
  function animate() {
    ctx.fillStyle = 'rgba(26, 26, 26, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00ff00';
    ctx.font = 'bold 16px monospace';
    ctx.shadowColor = '#00ff00';
    ctx.shadowBlur = 10;
    
    let finishedCount = 0;
    const barWidth = 25;
    
    for (let i = 0; i < drops.length; i++) {
      let y = drops[i] * 20;
      
      if (y > canvas.height) {
        finishedCount++;
        drops[i] = canvas.height;
      } else {
        ctx.fillText(characterLines[i], i * 30 + 5, y);
        drops[i]++;
      }
    }
    
    if (finishedCount === drops.length) {
      allFinished = true;
    }
    
    ctx.shadowBlur = 0;
    frameCount++;
    
    if (allFinished && frameCount > 200) {
      canvas.style.display = 'none';
      animationRunning = false;
      cancelAnimationFrame(waveAnimation);
    } else {
      waveAnimation = requestAnimationFrame(animate);
    }
  }
  
  animate();
}

document.addEventListener('DOMContentLoaded', function() {
  const themeToggle = document.getElementById('theme-toggle');
  const html = document.documentElement;
  
  // Check for saved theme preference or default to light mode
  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    html.classList.add('dark');
  }
  
  // Toggle theme on click
  themeToggle.addEventListener('click', function(e) {
    e.preventDefault();
    
    if (html.classList.contains('dark')) {
      html.classList.remove('dark');
      localStorage.setItem('theme', 'light');
    } else {
      html.classList.add('dark');
      localStorage.setItem('theme', 'dark');
      // Start wave effect when entering dark mode
      if (!animationRunning) {
        startWaveEffect();
      }
    }
  });
});

// Handle window resize
window.addEventListener('resize', function() {
  const canvas = document.getElementById('wave-canvas');
  if (canvas) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});
</script>

<!-- Hidden audio element for music -->
<audio id="background-music" loop>
  <source src="/files/audio/Bayonne_Right_Thing_Smooth_DJ_Edit_3min.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<script>
// Music playback toggle with persistence across pages
let isPlaying = false;
const audio = document.getElementById('background-music');
const musicToggle = document.getElementById('music-toggle');
const icon = musicToggle.querySelector('i');

// Check if music should be playing from previous page
window.addEventListener('load', function() {
  if (sessionStorage.getItem('musicPlaying') === 'true') {
    const savedTime = parseFloat(sessionStorage.getItem('musicTime')) || 0;
    audio.currentTime = savedTime;
    audio.play().catch(function(error) {
      console.log('Music playback failed:', error);
    });
    icon.style.animation = 'spin 0.8s linear infinite';
    isPlaying = true;
  }
});

// Update sessionStorage when user leaves the page
window.addEventListener('beforeunload', function() {
  if (isPlaying) {
    sessionStorage.setItem('musicPlaying', 'true');
    sessionStorage.setItem('musicTime', audio.currentTime);
  } else {
    sessionStorage.setItem('musicPlaying', 'false');
  }
});

musicToggle.addEventListener('click', function(e) {
  e.preventDefault();
  
  if (isPlaying) {
    audio.pause();
    icon.style.animation = 'none';
    isPlaying = false;
    sessionStorage.setItem('musicPlaying', 'false');
  } else {
    audio.play().catch(function(error) {
      console.log('Music playback failed:', error);
    });
    icon.style.animation = 'spin 0.8s linear infinite';
    isPlaying = true;
    sessionStorage.setItem('musicPlaying', 'true');
  }
});

// Add spin animation
const style = document.createElement('style');
style.textContent = `
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
`;
document.head.appendChild(style);
</script>
